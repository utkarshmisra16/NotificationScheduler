name: .NET CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ./EmailSchedulerApp.Tests/EmailSchedulerApp.Tests.csproj

      - name: Build
        run: dotnet build ./EmailSchedulerApp.Tests/EmailSchedulerApp.Tests.csproj --no-restore

      - name: Test
        run: dotnet test ./EmailSchedulerApp.Tests/EmailSchedulerApp.Tests.csproj --no-build